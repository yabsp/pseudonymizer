# Tests, then builds the desktop app for Linux (AppImage) and Windows (ZIP), both with PyTorch's CUDA build, which
# uses an NVIDIA GPU when there is one and the processor otherwise. Runs on version tags (v*) and by hand
# (Actions > Desktop app > Run workflow).
#
# The results are workflow artifacts, not release files: a GitHub release file can be at most 2 GiB, and the
# builds are about 6 to 7 GB (docs/adr/0008-desktop-packaging.md). Only synthetic data is used. The build environment
# comes from npm run setup (scripts/setup.mjs); the models are downloaded from Hugging Face and cached between runs.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'
  # The models build-models.mjs ships; the cache key changes when this list does.
  MODELS_KEY: gliner_multi_pii-v1+mdeberta-v3-base+docling-layout-tableformer-code_formula-rapidocr-de
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The fast suite uses stand-ins for the models, so it needs no .venv and no downloads.
      - run: npm run check
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            setup: npm run setup -- --torch cuda
            dist: npm run dist:linux
            files: dist/*.AppImage
          - name: Windows
            os: windows-latest
            setup: npm run setup -- --torch cuda
            dist: npm run dist:win
            files: dist/*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # The Linux build needs about 42 GB at its peak (measured 2026-10-29): .venv 8.2 GB, pip's cache 4 GB, models
      # 2.4 GB, build/ 10 GB, dist/linux-unpacked 9.7 GB and the AppImage 6.8 GB. The runner has about 14 GB free before this.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@v4
      # build/ and dist/ on the runner's second disk, when it has one.
      - name: Put build/ and dist/ on /mnt
        if: runner.os == 'Linux'
        run: |
          if [ -d /mnt ]; then
            sudo mkdir -p /mnt/build /mnt/dist && sudo chown "$USER" /mnt/build /mnt/dist
            ln -s /mnt/build build && ln -s /mnt/dist dist && df -h /mnt
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The models npm run setup puts in models/ (GLiNER with its tokenizer, Docling's layout, table, formula and
      # OCR models); with the cache restored, the setup skips their download.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ runner.os }}-${{ env.MODELS_KEY }}
      # pip's downloads (PyTorch alone is about 2.5 GB with CUDA), which npm run setup keeps in .cache/pip; a new key
      # when the requirements or the pinned versions in the setup change, starting from the last cache.
      - uses: actions/cache@v4
        with:
          path: .cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python/requirements.txt', 'scripts/setup.mjs') }}
          restore-keys: pip-${{ runner.os }}-
      # Before the setup, so setup-node's npm cache is used; the setup then skips this step.
      - run: npm ci
      # .venv with PyTorch's CUDA build, the requirements, PyInstaller and the spaCy models,
      # and the models in models/ (docs/setup.md, "Quick setup").
      - name: Setup
        run: ${{ matrix.setup }}
      - name: Build
        run: ${{ matrix.dist }}
      - name: Disk space left
        if: always() && runner.os == 'Linux'
        run: df -h / && if [ -d /mnt ]; then df -h /mnt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: pseudonymizer-${{ github.ref_name }}-${{ matrix.name }}
          path: ${{ matrix.files }}
          compression-level: 0
          retention-days: 30
